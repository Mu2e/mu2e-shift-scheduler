# Default values for mu2e-shifts-simple.
# Override with: helm upgrade --install ... -f my-values.yaml

image:
  repository: docker.io/normanajn/mu2e-shift-scheduler-web
  tag: latest
  pullPolicy: Always

replicaCount: 1

service:
  type: ClusterIP
  port: 8000

route:
  hostname: mu2e-shifts.fnal.gov
  timeout: 1800s
  # Route shard label matched by the OKD IngressController routeSelector.
  # Set to "" to leave the route unlabeled (default router shard).
  ingressController: public-proxy

certManager:
  enabled: true
  clusterIssuer: incommon-acme
  secretName: mu2e-shifts-tls
  externalCertificate: true

pvc:
  data:
    size: 1Gi
  csv:
    size: 1Gi

flask:
  # REQUIRED: set in my-values.yaml or with --set-string flask.secretKey=...
  secretKey: ""
  maxContentLength: "16777216"
  preferredUrlScheme: https

scheduler:
  configPath: /app/config/config.yaml

preferences:
  csvDir: /app/csv
  shiftsCsv: /app/csv/shifts.csv
  jsonPath: /app/data/preferences.json

# Container timezone: "today" on the calendar and log timestamps.
timezone: America/Chicago

data:
  dir: /app/data
  # SQLite database for named schedules, taxonomy, settings, and contacts.
  # Defaults to <data.dir>/app.sqlite when unset.
  appDbPath: ""

auth:
  dbPath: /app/data/users.sqlite
  sessionCookieSecure: "1"
  # Show the "Administrator Login" password form on the login page.
  # "0" hides it, leaving Fermilab SSO as the only advertised login.
  showAdminLogin: "0"
  initialAdminUsername: mu2e-admin
  initialAdminEmail: mu2e-admin@fnal.gov
  # REQUIRED for local administrator password login.
  initialAdminPassword: ""

oidc:
  providerUrl: ""
  clientId: ""
  clientSecret: ""

gunicorn:
  workers: 3
  timeout: 1800
  logLevel: info

resources:
  limits:
    cpu: "2"
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 1Gi
