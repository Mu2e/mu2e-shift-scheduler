apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mu2e-shifts-simple.labels" . | nindent 4 }}
type: Opaque
stringData:
  FLASK_SECRET_KEY: {{ required "flask.secretKey is required; set it in a private values file" .Values.flask.secretKey | quote }}
  MU2E_INITIAL_ADMIN_PASSWORD: {{ required "auth.initialAdminPassword is required; set it in a private values file" .Values.auth.initialAdminPassword | quote }}
  OIDC_CLIENT_SECRET: {{ .Values.oidc.clientSecret | quote }}
