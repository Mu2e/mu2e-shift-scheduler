[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mu2e-shift-scheduler"
version = "1.0.0"
description = "ILP-based operations shift scheduler and calendar for the Mu2e experiment"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Mu2e Collaboration" }]
requires-python = ">=3.10"
dependencies = [
    "pulp>=2.8",
    "flask>=3.0",
    "pyyaml>=6.0",
    "gunicorn>=22.0",
    "flask-login>=0.6",
    "authlib>=1.3",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mu2e-shift-scheduler = "cli:main"

[project.urls]
Homepage = "https://github.com/Mu2e/mu2e-shift-scheduler"
Issues = "https://github.com/Mu2e/mu2e-shift-scheduler/issues"

[tool.setuptools]
py-modules = ["cli", "wsgi", "run", "json_to_people_csv"]

[tool.setuptools.packages.find]
include = ["app*", "scheduler*"]

[tool.setuptools.package-data]
app = ["templates/**/*.html", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
