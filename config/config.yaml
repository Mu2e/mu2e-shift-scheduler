# Mu2e Shift Scheduler Configuration
# All values here are defaults and can be overridden by CLI arguments.

#
# These are the global defaults for the optimizer.  Basically this sets 
# up how the solve form is populated (but all can be updated from the web)
global:
  target_points_per_person: 2.0  # Soft target: penalty applied when actual != target (in shift-points)
  min_points_per_person: 1.0     # Hard minimum shift-points each person must accumulate
  max_points_per_person: 4.0     # Hard maximum shift-points each person may accumulate
  pass2_min_points_per_person: 0.0    # Pass-2 hard minimum (re-solve of non-preferred shifts)
  pass2_max_points_per_person: 2.0    # Pass-2 hard maximum

# Shift point values.
# Each shift carries a point value used in constraints and the objective.
# If a shift's CSV row includes a "points" column that value is used directly;
# otherwise the value is computed from the rules below.
shift_points:
  default: 1.0         # Points for a normal shift
  night: 2.0           # Points for a night shift
  night_start: "20:00" # Start of the night window (HH:MM, inclusive)
  night_end: "08:00"   # End of the night window (HH:MM, exclusive); wraps midnight when < night_start

# alpha controls the tradeoff between preference satisfaction and load balancing.
# Higher alpha => prioritize equitable shift points over personal preferences.
# Lower alpha => prioritize preferences, allow more uneven distribution.
alpha: 1.0

# Per-person constraint overrides (optional).
# These take precedence over the global defaults above.
overrides: []
# Example:
# overrides:
#   - name: "Alice"
#     min: 2.0
#     max: 4.0
#     target: 3.0


#################################################################
# Web Application Settings
# These are the settings that are used when 
# starting up the test server on the localhost (not when it's deployed)

web:
  host: "127.0.0.1"
  port: 8001
  debug: false

# Mu2e Collaboration directory sync (https://mu2e-collaboration.fnal.gov).
# Enabled when a bearer token is available. Never put the token itself here:
# use MU2E_COLLAB_TOKEN / MU2E_COLLAB_TOKEN_FILE (env or .env) or the CLI's
# --token-file. Precedence: command line > environment > .env > this file.
collaboration:
  base_url: "https://mu2e-collaboration.fnal.gov"
  sync_hours: 6          # periodic in-app sync; 0 disables (Admin > Collaboration Directory still works)
  fetch_phones: true     # per-record ?detail=full lookups; needs an admin-owned token
  members_only: true     # only active collaboration members are assignable
  timeout: 30            # seconds per HTTP request

# Shift self-signup: shifters claim open shifts from the calendar context menu
# or the Sign Up page, and release shifts they hold. Admins can close an
# individual schedule to self-signup on the Schedules page.
# Precedence: command line (serve --signup-*) > environment (MU2E_SIGNUP_*)
# > .env > this file > built-in defaults.
signup:
  enabled: true                  # MU2E_SIGNUP_ENABLED
  allow_block_signup: true       # MU2E_SIGNUP_ALLOW_BLOCK: claim every shift of a Shift Setup block at once
  allow_release_assigned: false  # MU2E_SIGNUP_ALLOW_RELEASE_ASSIGNED: may shifters drop solver/admin assignments?
  signup_cutoff_hours: 0         # MU2E_SIGNUP_CUTOFF_HOURS: no sign-up this close to the shift start
  release_cutoff_hours: 24       # MU2E_SIGNUP_RELEASE_CUTOFF_HOURS: no self-release this close to the start
  require_collab_member: false   # MU2E_SIGNUP_REQUIRE_COLLAB_MEMBER: must match an active directory member
